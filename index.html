<!DOCTYPE html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>最近上市 IPO</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Syne:wght@600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css?v=6" />
  </head>
  <body class="page-listed">
    <div class="atmosphere" aria-hidden="true"></div>
    <nav class="site-nav" aria-label="頁面切換">
      <a href="calendar.html">IPO 月曆</a>
      <a href="queue.html">排隊上市</a>
      <a href="index.html" aria-current="page">已上市</a>
    </nav>
    <header class="top listed-hero">
      <div class="brand-block">
        <p class="brand">IPO Ledger</p>
        <h1>最近上市</h1>
        <p class="lede">
          只顯示 AAStocks 最新一頁，聚焦超額、穩中一手資金同上市後表現。
        </p>
      </div>
      <div class="meta">
        <p id="stats">載入中…</p>
        <p id="fetched"></p>
        <a
          class="source"
          href="https://www.aastocks.com/tc/stocks/market/ipo/listedipo.aspx?s=3&o=0&page=1"
          target="_blank"
          rel="noopener noreferrer"
          >資料來源 · AAStocks</a
        >
      </div>
    </header>

    <section class="toolbar listed-toolbar" aria-label="篩選工具">
      <label class="search">
        <span class="sr-only">搜尋</span>
        <input
          id="search"
          type="search"
          placeholder="搜尋名稱或股份代號…"
          autocomplete="off"
        />
      </label>
      <label class="filter sort-filter">
        <span class="sr-only">排序</span>
        <select id="sort-key" aria-label="排序">
          <option value="listing_date">上市日期</option>
          <option value="oversub">超額倍數</option>
          <option value="one_lot_cash">穩中一手資金</option>
          <option value="first_day">首日表現</option>
          <option value="cumulative" selected>累積表現</option>
        </select>
      </label>
      <label class="filter">
        <input id="below-only" type="checkbox" />
        跌穿上市價
      </label>
      <label class="filter">
        <input id="oversub-1000" type="checkbox" />
        超額 ≥1000 倍
      </label>
      <p class="visible" id="visible-count"></p>
    </section>

    <main id="listed-list" class="listed-list" aria-live="polite"></main>

    <footer class="foot">
      <p>
        延遲報價最少十五分鐘。「穩中一手所需資金」= 穩中一手 × 每手股數 × 招股價。GitHub
        每日自動更新；本機即時更新請跑 <code>python3 server.py</code>。
      </p>
    </footer>

    <script src="load-data.js?v=1"></script>
    <script src="app.js?v=7"></script>
  </body>
</html>
